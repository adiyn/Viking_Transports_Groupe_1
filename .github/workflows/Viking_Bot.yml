name: Notification Discord Viking Bot

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Préparation et envoi du message Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
          ADDED: ${{ join(github.event.head_commit.added, ', ') }}
          MODIFIED: ${{ join(github.event.head_commit.modified, ', ') }}
          REMOVED: ${{ join(github.event.head_commit.removed, ', ') }}
        run: |
          jq -n \
            --arg username "Viking Bot" \
            --arg avatar "https://cdn.stickers.gg/stickers/8875-astolfo-gun.png" \
            '{
              username: $username, 
              avatar_url: $avatar, 
              content: [
                "@everyone **\(env.AUTHOR)** vient de push sur la branche `\(env.BRANCH)` !",
                "",
                "**Message :** \(env.COMMIT_MSG)",
                "**Commit :** `\((env.COMMIT_ID | .[0:7]))`",
                "**Ajouts :** \(if env.ADDED == "" then "Aucun" else env.ADDED end)",
                "**Modifications :** \(if env.MODIFIED == "" then "Aucun" else env.MODIFIED end)",
                "**Suppressions :** \(if env.REMOVED == "" then "Aucun" else env.REMOVED end)",
                "",
                "[Voir les modifications ici](\(env.COMMIT_URL))"
              ] | join("\n")
            }' > payload.json
          
          curl -s -H "Content-Type: application/json" -d @payload.json $WEBHOOK_URL
