name: Notification Discord Viking Bot

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Préparation et envoi du message Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token magique fourni par GitHub
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          # 1. On interroge l'API GitHub pour récupérer les détails réels du commit
          COMMIT_DATA=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/commits/$COMMIT_ID")

          # 2. On trie les fichiers selon leur statut (ajouté, modifié ou supprimé)
          ADDED=$(echo "$COMMIT_DATA" | jq -r '[.files[]? | select(.status=="added") | .filename] | if length>0 then join(", ") else "Aucun" end')
          MODIFIED=$(echo "$COMMIT_DATA" | jq -r '[.files[]? | select(.status=="modified") | .filename] | if length>0 then join(", ") else "Aucun" end')
          REMOVED=$(echo "$COMMIT_DATA" | jq -r '[.files[]? | select(.status=="removed") | .filename] | if length>0 then join(", ") else "Aucun" end')

          # 3. On prépare le message Discord
          jq -n \
            --arg username "Viking Bot" \
            --arg avatar "https://cdn.stickers.gg/stickers/8875-astolfo-gun.png" \
            --arg added "$ADDED" \
            --arg modified "$MODIFIED" \
            --arg removed "$REMOVED" \
            '{
              username: $username, 
              avatar_url: $avatar, 
              content: [
                "@everyone **\(env.AUTHOR)** vient de push sur la branche `\(env.BRANCH)` !",
                "",
                "**Message :** \(env.COMMIT_MSG)",
                "**Commit :** `\((env.COMMIT_ID | .[0:7]))`",
                "**Ajouts :** \($added)",
                "**Modifications :** \($modified)",
                "**Suppressions :** \($removed)",
                "",
                "[Voir les modifications ici](\(env.COMMIT_URL))"
              ] | join("\n")
            }' > payload.json
          
          # 4. Envoi final au serveur Discord
          curl -s -H "Content-Type: application/json" -d @payload.json $WEBHOOK_URL
