name: Notification Discord Viking Bot

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Préparation et envoi du message Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          # On récupère les listes en gérant le cas où GitHub renvoie null
          ADDED=$(echo '${{ toJson(github.event.head_commit.added) }}' | jq -r 'if type=="array" and length>0 then join(", ") else "Aucun" end')
          MODIFIED=$(echo '${{ toJson(github.event.head_commit.modified) }}' | jq -r 'if type=="array" and length>0 then join(", ") else "Aucun" end')
          REMOVED=$(echo '${{ toJson(github.event.head_commit.removed) }}' | jq -r 'if type=="array" and length>0 then join(", ") else "Aucun" end')

          jq -n \
            --arg username "Viking Bot" \
            --arg avatar "https://cdn.stickers.gg/stickers/8875-astolfo-gun.png" \
            --arg added "$ADDED" \
            --arg modified "$MODIFIED" \
            --arg removed "$REMOVED" \
            '{
              username: $username, 
              avatar_url: $avatar, 
              content: [
                "@everyone **\(env.AUTHOR)** vient de push sur la branche `\(env.BRANCH)` !",
                "",
                "**Message :** \(env.COMMIT_MSG)",
                "**Commit :** `\((env.COMMIT_ID | .[0:7]))`",
                "**Ajouts :** \($added)",
                "**Modifications :** \($modified)",
                "**Suppressions :** \($removed)",
                "",
                "[Voir les modifications ici](\(env.COMMIT_URL))"
              ] | join("\n")
            }' > payload.json
          
          curl -s -H "Content-Type: application/json" -d @payload.json $WEBHOOK_URL
