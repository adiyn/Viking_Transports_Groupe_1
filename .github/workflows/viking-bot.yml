name: Notification Discord Viking Bot

on:
  push:
    branches:
      - '**' # Le bot surveillera toutes les branches de l'équipe

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Préparation et envoi du message Discord
        run: |
          # message
          jq -n \
            --arg username "Viking Bot" \
            --arg avatar "https://cdn.stickers.gg/stickers/8875-astolfo-gun.png" \
            --arg content "**${{ github.actor }}** vient de push sur la branche \`${{ github.ref_name }}\` !\n\n💥 **Message :** ${{ github.event.head_commit.message }}\n🔗 [Voir les modifications ici](${{ github.event.head_commit.url }})" \
            '{username: $username, avatar_url: $avatar, content: $content}' > payload.json
          
          # envoi du payload
          curl -H "Content-Type: application/json" -d @payload.json ${{ secrets.DISCORD_WEBHOOK_URL }}
